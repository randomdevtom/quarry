<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarry Chat</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --text: #1d1c1a; --muted: #6b6862; --line: #e3e0da;
  --accent: #2f6f5e; --accent-text: #ffffff; --user: #e9efe9; --code: #f0eee9; --err: #a33a2a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --text: #e9e7e2; --muted: #9a968e; --line: #33322f;
          --accent: #5fae97; --accent-text: #0e1513; --user: #23302b; --code: #2a2926; --err: #e0806f; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
       display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
         background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .stat { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
header .spacer { flex: 1; }
header label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
header button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px;
                padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
#log { flex: 1; overflow-y: auto; padding: 16px; }
.wrap { max-width: 820px; margin: 0 auto; }
.msg { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
.user { background: var(--user); margin-left: 15%; }
.assistant { background: var(--panel); border: 1px solid var(--line); }
.msg pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; white-space: pre;
           font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; margin: 8px 0; }
.msg code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px;
            background: var(--code); padding: 1px 4px; border-radius: 4px; }
.msg pre code { background: none; padding: 0; }
.think { color: var(--muted); font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; margin-bottom: 8px; }
.meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
.err { color: var(--err); }
.empty { color: var(--muted); text-align: center; margin-top: 18vh; }
form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
form .wrap { display: flex; gap: 8px; width: 100%; }
textarea { flex: 1; resize: none; min-height: 44px; max-height: 40vh; padding: 10px 12px; border-radius: 8px;
           border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#send { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 0 18px;
        font: inherit; font-weight: 600; cursor: pointer; min-width: 76px; }
@media (max-width: 600px) { .user { margin-left: 8%; } header .stat { width: 100%; order: 9; } }
</style>
</head>
<body>
<header>
  <h1>Quarry</h1>
  <span class="stat" id="stat">ready</span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="think"> thinking</label>
  <label>temp <input type="number" id="temp" value="0.6" min="0" max="2" step="0.1" style="width:56px"></label>
  <button type="button" id="clear">New chat</button>
</header>
<div id="log"><div class="wrap" id="msgs"><div class="empty" id="empty">Local model on this machine. Ask anything.</div></div></div>
<form id="f"><div class="wrap">
  <textarea id="in" rows="1" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="send" type="submit">Send</button>
</div></form>
<script>
const $ = id => document.getElementById(id);
let history = [];
try { history = JSON.parse(localStorage.getItem("quarry-chat") || "[]"); } catch (e) { history = []; }
let busy = null;   // AbortController while generating

function esc(s) { return s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])); }
// minimal markdown: fenced code blocks, inline code, bold
function render(text) {
  const parts = text.split(/```/);
  return parts.map((p, i) => {
    if (i % 2) { const nl = p.indexOf("\n"); const body = nl >= 0 ? p.slice(nl + 1) : p; return "<pre><code>" + esc(body.replace(/\n$/, "")) + "</code></pre>"; }
    return esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  }).join("");
}
function split_think(text) {   // "<think>...</think>answer" when thinking is on
  const a = text.indexOf("<think>"), b = text.indexOf("</think>");
  if (a < 0) return [null, text];
  if (b < 0) return [text.slice(a + 7), ""];
  return [text.slice(a + 7, b), text.slice(b + 8)];
}
function bubble(role, text, meta) {
  $("empty") && $("empty").remove();
  const d = document.createElement("div");
  d.className = "msg " + role;
  set(d, role, text, meta);
  $("msgs").appendChild(d);
  return d;
}
function set(d, role, text, meta) {
  if (role === "user") { d.textContent = text; return; }
  const [th, ans] = split_think(text);
  d.innerHTML = (th !== null ? '<div class="think">' + esc(th.trim()) + "</div>" : "") + render(ans.replace(/^\n+/, "")) +
                (meta ? '<div class="meta">' + meta + "</div>" : "");
}
function scroll() { const l = $("log"); l.scrollTop = l.scrollHeight; }
function save() { try { localStorage.setItem("quarry-chat", JSON.stringify(history)); } catch (e) {} }
function redraw() {
  $("msgs").innerHTML = history.length ? "" : '<div class="empty" id="empty">Local model on this machine. Ask anything.</div>';
  for (const m of history) bubble(m.role, m.content, m.meta);
  scroll();
}

async function send(text) {
  history.push({role: "user", content: text});
  bubble("user", text);
  const d = bubble("assistant", "…");
  scroll();
  busy = new AbortController();
  $("send").textContent = "Stop";
  $("stat").textContent = "reading prompt…";
  const think = $("think").checked;
  let out = "", t0 = performance.now(), tFirst = 0, ntok = 0, usage = null;
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", headers: {"Content-Type": "application/json"}, signal: busy.signal,
      body: JSON.stringify({model: "quarry", stream: true, temperature: +$("temp").value, max_tokens: 4096,
                            chat_template_kwargs: {enable_thinking: think},
                            messages: history.map(m => ({role: m.role, content: m.role === "assistant" ? split_think(m.content)[1] : m.content}))})
    });
    if (!r.ok) throw new Error("server said " + r.status);
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {value, done} = await rd.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch (e) { continue; }
        if (j.usage) usage = j.usage;
        const delta = j.choices && j.choices[0] && j.choices[0].delta;
        const piece = delta && (delta.content || delta.reasoning_content);
        if (piece) {
          if (!tFirst) tFirst = performance.now();
          ntok++; out += piece;
          set(d, "assistant", out);
          const s = (performance.now() - tFirst) / 1000;
          $("stat").textContent = s > 0.5 ? (ntok / s).toFixed(1) + " tok/s" : "writing…";
          scroll();
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") { d.innerHTML += '<div class="meta err">' + esc(String(e.message || e)) + "</div>"; }
  }
  const gen = usage ? usage.completion_tokens : ntok, secs = tFirst ? (performance.now() - tFirst) / 1000 : 0;
  const meta = gen + " tokens" + (secs > 0 ? " · " + (gen / secs).toFixed(1) + " tok/s" : "") +
               (tFirst ? " · prompt " + ((tFirst - t0) / 1000).toFixed(1) + "s" : "");
  set(d, "assistant", out || "(no reply)", meta);
  history.push({role: "assistant", content: out, meta});
  save();
  busy = null;
  $("send").textContent = "Send";
  $("stat").textContent = "ready";
  scroll();
}

$("f").addEventListener("submit", e => {
  e.preventDefault();
  if (busy) { busy.abort(); return; }
  const t = $("in").value.trim();
  if (!t) return;
  $("in").value = ""; $("in").style.height = "";
  send(t);
});
$("in").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); }
});
$("in").addEventListener("input", () => { const t = $("in"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; });
$("clear").addEventListener("click", () => { if (busy) busy.abort(); history = []; save(); redraw(); });
redraw();
$("in").focus();
</script>
</body>
</html>
